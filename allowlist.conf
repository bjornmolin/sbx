# sbx egress allowlist.
# One hostname per line. Lines starting with '#' are comments.
#
# Plain entry           -> exact match (e.g. github.com)
# *.example.com         -> any subdomain at any depth under example.com
#                          (does NOT match example.com itself; add it separately)
#
# After editing, run:  bin/sbx build-proxy

# --- rustup / cargo ---
static.rust-lang.org
crates.io
index.crates.io
static.crates.io

# --- node / npm ---
registry.npmjs.org
nodejs.org

# --- python ---
pypi.org
files.pythonhosted.org
*.pypi.org
*.pythonhosted.org

# --- go modules ---
proxy.golang.org
sum.golang.org
go.dev
storage.googleapis.com

# --- ruby ---
rubygems.org
*.rubygems.org

# --- github ---
github.com
api.github.com
codeload.github.com
objects.githubusercontent.com
raw.githubusercontent.com
*.githubusercontent.com

# --- container registries (left commented; uncomment if you build images inside) ---
# ghcr.io
# registry-1.docker.io
# auth.docker.io
# production.cloudflare.docker.com

# --- model providers (uncomment what you actually use) ---
