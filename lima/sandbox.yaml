# Lima VM template for the sbx sandbox runtime.
# A single shared VM, used by ALL sbx projects — created once, never recreated
# when adding projects. Per-project isolation lives one layer down, inside
# containerd (per-project network + proxy + cache volume + bind mount).
#
# On Linux the wrapper bypasses Lima entirely and uses rootless containerd
# directly; this template is macOS-only.

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
  arch: "x86_64"
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

vmType: "vz"

cpus: 4
memory: "8GiB"
disk: "60GiB"

# Mounts are NOT defined here. The wrapper renders them from
# ~/.config/sbx/config.json (key: mount_dirs) at VM creation time and on
# `sbx add-mount`. Default config mounts only ~/dev, so dotfiles in $HOME
# (~/.ssh, ~/.aws, ~/.gnupg, ...) are NOT visible inside the Lima VM.
mountType: "virtiofs"

containerd:
  system: false
  user: true

portForwards:
- guestPortRange: [1, 65535]
  ignore: true
