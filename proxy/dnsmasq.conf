# Captive DNS for the sandbox network.
# Every A query is answered with the proxy's own IP. The sandbox container
# then opens TCP/443 to that address; sniproxy reads SNI and decides whether
# to forward to the real host or close the connection.

# Do not read the host's resolv.conf — we only serve the captive answer.
no-resolv
no-hosts

# Listen on the proxy's container interfaces (sniproxy joins this container's
# network namespace, so 0.0.0.0 binds to all attached interfaces).
listen-address=0.0.0.0
bind-interfaces

# Disable IPv6 answers — AAAA lookups would otherwise return no records and
# stall clients waiting for the IPv4 fallback timeout.
filter-AAAA

# Wildcard: any A query gets the proxy IP. PROXY_IP is templated by the
# entrypoint when the container starts.
address=/#/__PROXY_IP__

# A small TTL keeps stale answers from sticking around if the proxy IP changes.
local-ttl=30

log-queries=extra
log-facility=-
